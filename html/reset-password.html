<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamGachi - 비밀번호 재설정</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-brand"><div class="brand-logo-icon"></div><span class="brand-logo-title">TeamGachi</span></div>
    <div class="auth-card">
      <h1 class="auth-card-title">새 비밀번호 설정</h1>
      <form data-reset-form>
        <div class="form-group"><label>새 비밀번호</label><input type="password" name="password" minlength="8" required></div>
        <div class="form-group"><label>비밀번호 확인</label><input type="password" name="password_confirm" minlength="8" required></div>
        <button type="submit" class="btn btn-primary">비밀번호 변경</button>
        <p class="auth-status" data-auth-status aria-live="polite"></p>
      </form>
    </div>
  </div>
  <script type="module" src="../js/reset-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamGachi - 업무 · 진척도</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="../css/group2.css">
</head>
<body class="dashboard-body">

  <div class="app-layout">
    
    <aside class="sidebar">
      
      <div class="sidebar-brand">
        <img src="../logo.png" alt="TeamGachi" class="brand-logo-img">
        <span class="brand-logo-title">TeamGachi</span>
      </div>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <i data-lucide="layout-dashboard"></i> <span>대시보드</span>
        </a>
        <a href="todo.html" class="menu-item">
          <i data-lucide="check-square"></i> <span>할 일</span>
        </a>
        <a href="chat.html" class="menu-item">
          <i data-lucide="message-square"></i> <span>채팅 · 자료함</span>
        </a>
        <a href="calendar.html" class="menu-item">
          <i data-lucide="calendar"></i> <span>캘린더</span>
        </a>
        <a href="progress.html" class="menu-item active">
          <i data-lucide="bar-chart-2"></i> <span>업무 · 진척도</span>
        </a>
        <a href="#" class="menu-item">
          <i data-lucide="timer"></i> <span>집중 타이머</span>
        </a>
        <a href="#" class="menu-item">
          <i data-lucide="megaphone"></i> <span>공지사항</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <div class="profile-avatar"></div>
        <div class="profile-meta">
          <div class="profile-name">불러오는 중</div>
          <div class="profile-role"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      
      <header class="main-header">
        <h2 class="header-page-name">업무 · 진척도</h2>
        <div class="header-right-tools">
          <div class="header-search">
            <i data-lucide="search" class="search-ic"></i>
            <input type="text" placeholder="검색">
          </div>
          <button class="header-btn-icon"><i data-lucide="bell"></i></button>
          <div class="header-profile-avatar"></div>
        </div>
      </header>

      <div class="progress-container">
        
        <div class="ui-card progress-summary-card">
          <div class="card-header-row">
            <h3 class="card-title">프로젝트 전체 진행률</h3>
            <span class="dday-tag">등록된 마감일 없음</span>
          </div>
          
          <div class="progress-main-row">
            <div class="percent-big">0%</div>
            <div class="bar-bg-lg">
              <div class="bar-fill-lg" style="width: 0%;"></div>
            </div>
            <div class="status-count-group">
              <span class="count-item"><span class="dot completed"></span> 완료 <strong>0</strong></span>
              <span class="count-item"><span class="dot in-progress"></span> 진행 중 <strong>0</strong></span>
              <span class="count-item"><span class="dot pending"></span> 대기 <strong>0</strong></span>
            </div>
          </div>
        </div>

        <div class="ui-card team-status-card">
          <div class="card-header-row mb-16">
            <h3 class="card-title">팀원별 업무 현황</h3>
            <div class="card-header-actions">
              <select class="select-period">
                <option>전체 기간</option>
              </select>
              <button class="btn-assign">업무 배정</button>
            </div>
          </div>

          <div class="team-table">
            <div class="team-table-head">
              <span class="th-member">팀원</span>
              <span class="th-role">담당 영역</span>
              <span class="th-task">주요 업무</span>
              <span class="th-progress">진행률</span>
              <span class="th-done">완료</span>
              <span class="th-delay">지연</span>
            </div>

            <div class="team-table-row">
              <div class="empty-state">등록된 팀원 업무가 없습니다.</div>
            </div>
          </div>
        </div>

        <div class="kanban-section">
          <div class="kanban-header-row">
            <h3 class="kanban-title">업무 분담 보드</h3>
            <span class="kanban-guide">드래그해서 상태를 변경할 수 있습니다</span>
          </div>

          <div class="kanban-grid">
            
            <div class="kanban-column">
              <div class="column-title-bar">
                <span class="col-name">대기 <span class="badge-num">0</span></span>
                <button class="btn-add-item">+</button>
              </div>

              <div class="empty-state">업무가 없습니다.</div>
            </div>

            <div class="kanban-column">
              <div class="column-title-bar">
                <span class="col-name">진행 중 <span class="badge-num">0</span></span>
                <button class="btn-add-item">+</button>
              </div>

              <div class="empty-state">업무가 없습니다.</div>
            </div>

            <div class="kanban-column">
              <div class="column-title-bar">
                <span class="col-name">완료 <span class="badge-num">0</span></span>
                <button class="btn-add-item">+</button>
              </div>

              <div class="empty-state">업무가 없습니다.</div>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="../js/progress.js"></script>
</body>
</html>

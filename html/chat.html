<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="apple-touch-icon" href="../logo.png">
  <title>TeamGachi - 채팅 · 자료함</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="../css/group2.css">
</head>
<body class="dashboard-body">

  <div class="app-layout">
    
    <aside class="sidebar">
      
      <div class="sidebar-brand">
        <img src="../logo.png" alt="TeamGachi" class="brand-logo-img">
        <span class="brand-logo-title">TeamGachi</span>
      </div>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <i data-lucide="layout-dashboard"></i> <span>대시보드</span>
        </a>
        <a href="todo.html" class="menu-item">
          <i data-lucide="check-square"></i> <span>할 일</span>
        </a>
        <a href="chat.html" class="menu-item active">
          <i data-lucide="message-square"></i> <span>채팅 · 자료함</span>
        </a>
        <a href="calendar.html" class="menu-item">
          <i data-lucide="calendar"></i> <span>캘린더</span>
        </a>
        <a href="progress.html" class="menu-item">
          <i data-lucide="bar-chart-2"></i> <span>업무 · 진척도</span>
        </a>
        <a href="#" class="menu-item">
          <i data-lucide="timer"></i> <span>집중 타이머</span>
        </a>
        <a href="#" class="menu-item">
          <i data-lucide="megaphone"></i> <span>공지사항</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <div class="profile-avatar"></div>
        <div class="profile-meta">
          <div class="profile-name">불러오는 중</div>
          <div class="profile-role"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      
      <header class="main-header">
        <h2 class="header-page-name">채팅 · 자료함</h2>
        <div class="header-right-tools">
          <div class="header-search">
            <i data-lucide="search" class="search-ic"></i>
            <input type="text" placeholder="검색">
          </div>
          <button class="header-btn-icon"><i data-lucide="bell"></i></button>
          <div class="header-profile-avatar"></div>
        </div>
      </header>

      <div class="chat-container">
        
        <section class="chat-main-card">
          
          <div class="chat-header">
            <div class="chat-title-group">
              <span class="chat-channel-name"># 팀 채팅</span>
              <span class="chat-member-count">팀원 0명</span>
            </div>
            <div class="chat-header-actions">
              <button class="btn-ai-summary">대화 자동 요약</button>
              <button class="btn-more-options" data-team-menu title="팀 관리"><i data-lucide="more-vertical"></i></button>
            </div>
          </div>

          <div class="chat-body">
            <div class="ai-summary-card">
              <div class="ai-summary-header">
                <span class="ai-badge">자동</span>
                <span class="ai-summary-title">대화 요약 (메시지 0건)</span>
              </div>
              <ul class="ai-summary-list">
                <li>요약할 대화가 없습니다.</li>
              </ul>
            </div>
            <div class="empty-state">첫 메시지를 보내 대화를 시작해 보세요.</div>
          </div>

          <div class="chat-input-area">
            <div class="chat-input-box">
              <input type="text" placeholder="메시지를 입력하세요" class="input-msg">
              <button class="btn-attach">첨부</button>
              <button class="btn-send">전송</button>
            </div>
          </div>

        </section>

        <aside class="drive-side-card">
          
          <div class="drive-header">
            <h3 class="drive-title">자료 드라이브</h3>
            <span class="drive-count">전체 0개</span>
          </div>

          <div class="drive-tabs">
            <button class="drive-tab active">파일</button>
            <button class="drive-tab">링크</button>
            <button class="drive-tab">이미지</button>
          </div>

          <div class="upload-dropzone">
            <div class="upload-icon-sm"></div>
            <div class="upload-text">파일을 끌어 놓거나 클릭해 업로드</div>
            <div class="upload-subtext">최대 20MB · PDF, 이미지, 문서</div>
          </div>

          <ul class="file-list">
            <li class="empty-state">업로드한 파일이 없습니다.</li>
          </ul>

          <div class="storage-info-box">
            <div class="storage-text-row">
              <span class="storage-label">저장 공간</span>
              <span class="storage-value">0B / 1GB</span>
            </div>
            <div class="storage-bar-bg">
              <div class="storage-bar-fill" style="width: 0%;"></div>
            </div>
          </div>

        </aside>

      </div>
    </main>
  </div>

  <script type="module" src="../js/chat.js"></script>
</body>
</html>

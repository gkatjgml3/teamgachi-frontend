<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamGachi - 채팅 · 자료함</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="apple-touch-icon" href="../logo.png">
  <link rel="stylesheet" href="../css/chat.css">
  <link rel="stylesheet" href="../css/shared-layout.css">
</head>
<body class="dashboard-body">
  <div class="app-container">

    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar-brand brand-home-link" aria-label="대시보드로 이동" style="color:inherit;text-decoration:none">
        <img src="../logo.png" alt="팀가치 로고" class="brand-logo-img">
        <span class="brand-title">TeamGachi</span>
      </a>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>대시보드</span>
        </a>
        <a href="todo.html" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span>할 일</span>
        </a>
        <a href="chat.html" class="menu-item active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span>채팅 · 자료함</span>
        </a>
        <a href="calendar.html" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>캘린더</span>
        </a>
        <a href="progress.html" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
          <span>업무 · 진척도</span>
        </a>
        <a href="timer.html" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>집중 타이머</span>
        </a>
        <a href="notice.html" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span>공지사항</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <span class="profile-avatar pastel-avatar" aria-hidden="true"></span>
        <div>
          <div class="profile-name">불러오는 중</div>
          <div class="profile-role"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <h1 class="header-page-name">채팅 · 자료함</h1>
        <div class="header-right-tools">
          <div class="header-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" placeholder="검색...">
          </div>
          <button class="header-btn-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          </button>
          <span class="header-profile-avatar pastel-avatar" aria-hidden="true"></span>
        </div>
      </header>

      <div class="content-body">

        <div class="chat-layout">

          <div class="card chat-card">
            <div class="chat-header-bar">
              <div class="chat-title-group">
                <span class="chat-title chat-channel-name"># 팀 채팅</span>
                <span class="chat-member-count">팀원 0명</span>
              </div>
              <button class="btn-primary btn-ai-summary">AI 대화 요약</button>
            </div>

            <div class="chat-messages chat-body"><div class="empty-state">첫 메시지를 보내 대화를 시작해 보세요.</div></div>

            <div class="chat-input-wrapper">
              <input type="text" class="input-msg" placeholder="메시지를 입력하세요">
              <div class="chat-input-tools">
                <button class="btn-attach">첨부</button>
                <button class="btn-primary btn-send" style="padding: 6px 14px;">전송</button>
              </div>
            </div>

          </div>

          <div class="card drive-card">
            <div class="drive-header">
              <span class="drive-title">자료 드라이브</span>
              <span class="drive-total-count drive-count">전체 0개</span>
            </div>

            <div class="drive-tabs">
              <button class="drive-tab active">파일</button>
              <button class="drive-tab">링크</button>
              <button class="drive-tab">이미지</button>
            </div>

            <div class="file-dropzone upload-dropzone" role="button" tabindex="0">
              <div class="dropzone-icon"></div>
              <div class="dropzone-text upload-text">파일을 끌어다 놓거나 클릭해 업로드</div>
              <div class="dropzone-subtext">최대 20MB · PDF, 이미지, 문서</div>
            </div>

            <div class="drive-file-list file-list"><div class="empty-state">업로드한 자료가 없습니다.</div></div>

            <div class="storage-info">
              <div class="storage-labels">
                <span class="storage-title">저장 공간</span>
                <span class="storage-value">0B / 1GB</span>
              </div>
              <div class="storage-bar-bg">
                <div class="storage-bar-fill"></div>
              </div>
            </div>

          </div>

        </div>

      </div>
    </main>

  </div>
  <div id="app-modal-root" aria-live="polite"></div>
  <template id="app-modal-template">
    <div class="app-overlay"><section class="app-modal" role="dialog" aria-modal="true" data-modal-dialog><div class="app-modal-header"><h3 data-modal-title></h3><button type="button" data-close aria-label="닫기">×</button></div><div class="app-modal-body"></div></section></div>
  </template>
  <script type="module" src="../js/chat.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamGachi - 회원가입</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo-icon"></div>
      <span class="brand-logo-title">TeamGachi</span>
    </div>
    <p class="auth-subtitle">팀 프로젝트에 필요한 모든 것을 한 곳에서</p>

    <div class="auth-card">
      <h1 class="auth-card-title">회원가입</h1>

      <form data-auth-form data-mode="signup">
        <div class="form-group">
          <label>이름</label>
          <input type="text" name="display_name" placeholder="홍길동" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label>이메일</label>
          <input type="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" name="password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" placeholder="8자 이상, 영문+숫자 조합" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label>비밀번호 확인</label>
          <input type="password" name="password_confirm" minlength="8" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label>팀 초대 코드 (선택)</label>
          <input type="text" name="invite_code" placeholder="팀장에게 받은 코드를 입력하세요">
        </div>

        <div class="form-row mb-16">
          <label class="checkbox-label">
            <input type="checkbox" required>
            <span>이용약관 및 개인정보 처리방침에 동의합니다</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary">회원가입</button>
        <p class="auth-status" data-auth-status aria-live="polite"></p>
      </form>

      <div class="auth-footer-text">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
      </div>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>

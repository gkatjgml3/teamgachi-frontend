<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamGachi - 대시보드</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="brand-logo-icon sm"></div><span class="brand-logo-title">TeamGachi</span></div>
      <nav class="sidebar-menu">
        <a class="menu-item active" href="dashboard.html"><i data-lucide="layout-dashboard"></i>대시보드</a>
      </nav>
      <div class="sidebar-profile">
        <div class="profile-avatar"></div>
        <div><div class="profile-name" data-profile-name>불러오는 중</div><div class="profile-role" data-profile-email></div></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <span class="header-page-name">백엔드 연결 테스트</span>
        <button class="btn-small" type="button" data-logout>로그아웃</button>
      </header>

      <div class="dashboard-inner backend-dashboard">
        <section class="welcome-section">
          <div><h1 class="welcome-heading">팀가치에 오신 것을 환영합니다</h1><p class="project-tag-info">Supabase 로그인·팀·할 일 기능이 연결되어 있습니다.</p></div>
        </section>

        <p class="connection-status" data-dashboard-status aria-live="polite"></p>

        <section class="ui-card backend-panel">
          <div class="ui-card-header"><h2 class="ui-card-title">현재 팀</h2></div>
          <div class="team-toolbar">
            <select data-team-select aria-label="현재 팀"></select>
            <form data-team-form>
              <input name="team_name" maxlength="80" placeholder="새 팀 이름" required>
              <button class="btn-small btn-accent" type="submit">팀 만들기</button>
            </form>
          </div>
          <p class="empty-guide" data-team-guide>참여 중인 팀이 없다면 새 팀을 만들어 주세요.</p>
        </section>

        <section class="ui-card backend-panel" data-todo-section hidden>
          <div class="ui-card-header"><h2 class="ui-card-title">할 일</h2><span class="ai-pill">Realtime</span></div>
          <form class="todo-create-form" data-todo-form>
            <input name="title" maxlength="200" placeholder="새 할 일을 입력하세요" required>
            <input name="due_at" type="datetime-local" aria-label="마감일">
            <button class="btn-small btn-accent" type="submit">등록</button>
          </form>
          <ul class="todo-list" data-todo-list></ul>
          <p class="empty-guide" data-todo-empty>등록된 할 일이 없습니다.</p>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>

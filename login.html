<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamGachi - 로그인</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo-icon"></div>
      <span class="brand-logo-title">TeamGachi</span>
    </div>
    <p class="auth-subtitle">팀 프로젝트에 필요한 모든 것을 한 곳에서</p>

    <div class="auth-card">
      <h1 class="auth-card-title">로그인</h1>

      <form data-auth-form data-mode="login">
        <div class="form-group">
          <label>이메일</label>
          <input type="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox">
            <span>로그인 상태 유지</span>
          </label>
          <a href="#" class="forgot-link" data-forgot-password>비밀번호 찾기</a>
        </div>

        <button type="submit" class="btn btn-primary">로그인</button>
        <p class="auth-status" data-auth-status aria-live="polite"></p>
      </form>

      <div class="auth-divider">
        <span>또는</span>
      </div>

      <button type="button" class="btn btn-google" data-google-login>
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.23v3.15C3.25 21.32 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.23C.44 8.15 0 9.99 0 12s.44 3.85 1.23 5.42l4.05-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.68 1.23 6.58l4.05 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        Google 계정으로 계속하기
      </button>

      <div class="auth-footer-text">
        아직 계정이 없으신가요? <a href="signup.html">회원가입</a>
      </div>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
